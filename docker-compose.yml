services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: databridge
      POSTGRES_USER: databridge
      POSTGRES_PASSWORD: localdemo
    ports:
      - '5434:5432'
    volumes:
      - databridge_pgdata:/var/lib/postgresql/data
      - ./sql/postgresql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
volumes:
  databridge_pgdata:
